<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keli Lab</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--muted:#666;--link:#1a5fb4;--card:#fff;--line:#e6e1d8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#eee;--muted:#aaa;--link:#8ab4f8;--card:#262522;--line:#3a3833}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:40px 16px}
h1{font-size:1.6rem;margin:0 0 4px}
p.lead{color:var(--muted);margin:0 0 32px}
.app{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:16px}
.app h2{font-size:1.1rem;margin:0 0 4px}
.app p{margin:0 0 8px}
a{color:var(--link)}
footer{color:var(--muted);font-size:.9rem;margin-top:40px}
</style>
</head>
<body>
<main>
<h1>Keli Lab</h1>
<p class="lead">小さなアプリをつくっている個人のアプリスタジオです。</p>

<div class="app">
<h2>積ん読つもり？</h2>
<p>積んだままの本から、毎朝1冊だけ「今日のお題」が届く読書アプリ。</p>
<a href="https://apps.apple.com/jp/app/id6818202855">App Store で見る</a>
</div>

<div class="app">
<h2>One minute output</h2>
<p>1分のあいだ、頭に浮かんだことを書き出すだけのメモアプリ。</p>
<a href="https://apps.apple.com/jp/app/one-minute-output/id6739904766">App Store で見る</a>
</div>

<footer>お問い合わせ：kelilab.app@gmail.com</footer>
</main>
</body>
</html>
